# Render Blueprint: the API web service and its Postgres database.
# Deploy: Render dashboard > New > Blueprint > pick this repo. Runbook: docs/deploy.md.
# Secrets are never in this file: every `sync: false` value is entered in the dashboard on first deploy.
# Spec: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mandate-api
    runtime: node
    plan: free
    region: singapore
    # pnpm comes from the packageManager field in package.json via corepack.
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    # Migrations run before the server starts. Safe on every boot: they are idempotent and serialised by an
    # advisory lock, and the deploy fails (keeping the old version live) if a migration fails.
    # The demo seed only inserts missing rows (ON CONFLICT DO NOTHING), so edits made through the app survive a
    # restart. It runs here because the free plan has no Shell or pre-deploy command to run it once by hand.
    startCommand: pnpm db:migrate && pnpm db:seed && pnpm --filter @mandate/api start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Node 22.18+ strips TypeScript types by default; the API runs from source (apps/api, PR #30).
      - key: NODE_VERSION
        value: 24.16.0
      # Render routes traffic to 0.0.0.0:$PORT; the API defaults to loopback otherwise.
      - key: HOST
        value: 0.0.0.0
      # The web app's origin, e.g. https://<web-url> (comma-separate several). Unset: no CORS.
      - key: WEB_ORIGIN
        sync: false
      # Approvals through Zapier (docs/zapier.md): the Catch Hook URL, and the web app URL for review links.
      - key: ZAPIER_APPROVAL_WEBHOOK_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: mandate-db
          property: connectionString
      # PayPal sandbox app credentials (packages/payments is sandbox-only; there is no live setting).
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_RETURN_URL
        sync: false
      - key: PAYPAL_CANCEL_URL
        sync: false
      # Id of the webhook registered on the sandbox app for https://<service>/webhooks/paypal. Without it the
      # webhook route is not registered; the reconcile job still settles orders by polling PayPal.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # LLM (packages/llm, docs/llm-layer.md section 9): Mistral Large 4 on NVIDIA's API catalog. Only the key
      # is secret; take the model id from https://integrate.api.nvidia.com/v1/models, never guess it.
      - key: LLM_PROVIDER
        value: openai-compatible
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL
        value: mistralai/mistral-large-4-1t-a52b
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_API_KEY
        sync: false
      # Optional Gemini fallback (docs/llm-layer.md section 9). Off while the key is unset.
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_FALLBACK_MODEL
        sync: false
      # Abuse protection (#62, docs/deploy.md "Abuse protection"). The kill switch is set in the dashboard only, so
      # a Blueprint sync never overwrites it: unset or "true" is on, "false" turns off the LLM and payment routes.
      - key: PURCHASES_ENABLED
        sync: false
      # Render's proxies reach the service from its private network. VERIFY on the deployed API (deploy.md steps):
      # spoofed X-Forwarded-For must not bypass the limit, and two networks must not share one bucket.
      - key: TRUST_PROXY
        value: 10.0.0.0/8
      # Opt-in diagnostic for the VERIFY above (docs/deploy.md): set "true" in the dashboard, test, then remove it.
      # Logs hop counts and a salted client hash, never raw IPs. Unset or "false": off.
      - key: DEBUG_PROXY_HOPS
        sync: false
      - key: LLM_DAILY_REQUEST_CAP
        value: "100"
      # Per client (IPv4, or IPv6 /64) per UTC day, below the global cap. In memory: a restart resets it.
      - key: LLM_DAILY_PER_IP_CAP
        value: "20"
      - key: LLM_MAX_CONCURRENT
        value: "2"

  # The web app (apps/web): a static Vite build. VITE_* values are compiled into public JavaScript, so they
  # must never hold a secret. Set WEB_ORIGIN on mandate-api to this site's URL. VERIFY on first deploy.
  - type: web
    name: mandate-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @mandate/web build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      # The API's public URL, e.g. https://<api-url>; copy it from the service page, never guess it
      - key: VITE_API_URL
        sync: false
      - key: VITE_MANDATE_ID
        value: 00000000-0000-4000-8000-000000000021

databases:
  - name: mandate-db
    plan: free
    region: singapore
    databaseName: mandate
    user: mandate
    postgresMajorVersion: "17"
    # No external connections: only services in this Render account can reach the database.
    ipAllowList: []
